name: Territory-Map veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Upload-Dateien zusammensetzen
        run: python3 assemble.py

      - name: Ladefunktion prüfen
        run: node _bundle/tests/pages-runtime.mjs

      - name: Datenvollständigkeit prüfen
        run: python3 _bundle/tools/verify-package.py

      - name: Alle 72 Funktionstests prüfen
        run: node ci-checks.mjs

      - name: Prüfprotokolle sichern
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: territory-lab-pruefprotokolle
          path: |
            _bundle/verification/ci-core-results.json
            _bundle/verification/ci-time-budgets.json
            _bundle/verification/package-results.json
            _bundle/verification/*.mjs.log
          if-no-files-found: warn
          retention-days: 7

      - name: Website bereitstellen
        run: |
          mkdir _site
          cp _bundle/index.html _bundle/.nojekyll _bundle/LICENSE-* _site/
          cp -R _bundle/web _bundle/assets _site/
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/web/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('Territory Lab · Standalone 5.0.0', 'Territory-Map · 5.0.0')
          html = html.replace('<strong>TERRITORY LAB</strong>', '<strong>TERRITORY-MAP</strong>')
          page.write_text(html, encoding='utf-8')
          PY

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5.0.1
